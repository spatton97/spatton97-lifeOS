# Gmail OAuth (optional): after creating an iOS OAuth client in Google Cloud, add:
#   INFOPLIST_KEY_LifeOSGmailClientID: "YOUR_ID.apps.googleusercontent.com"
# and register the reversed client ID as a CFBundleURLTypes URL scheme (see SETUP.md).
name: LifeOS
options:
  bundleIdPrefix: com.lifeos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock LifeOS"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.app
        PRODUCT_NAME: LifeOS
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock LifeOS"
